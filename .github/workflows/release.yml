name: Tkya Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.0
        required: true
        default: v1.1.0
        type: string
      publish:
        description: Publish a GitHub Release with Sigstore keyless signatures
        required: true
        default: false
        type: boolean

# Sigstore keyless signing needs OIDC. The release job only publishes artifacts
# produced by this workflow and signs them with an ephemeral Fulcio certificate.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: tkya-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      android_signing_ready: ${{ steps.signing.outputs.android_ready }}
      publish: ${{ steps.signing.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version_line="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          version="${version_line%%+*}"
          build_number="${version_line#*+}"
          expected_tag="v${version}"
          if [[ "$REQUESTED_TAG" != "$expected_tag" ]]; then
            echo "Tag $REQUESTED_TAG does not match pubspec version $expected_tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
      - id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          android_ready=false
          publish=false

          # Android's package signature is separate from Sigstore. Keep the
          # stable keystore optional for CI evaluation, but recommend it for
          # install-over-update compatibility with previous Tkya releases.
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            android_ready=true
          fi
          if [[ ( "$IS_TAG_RELEASE" == "true" || "$MANUAL_PUBLISH" == "true" ) && "$android_ready" == "true" ]]; then
            publish=true
          fi

          echo "android_ready=$android_ready" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$android_ready" != "true" ]]; then
            echo "Public release is gated: configure ANDROID_* secrets so APK updates retain the stable Android package signature."
          fi
          echo "Sigstore keyless signing is enabled; no Azure Trusted Signing secrets are required."

  # 从源码编译 hiddify-core（带用户自定义分流规则支持）。
  # 官方流程是从 hiddify-next-core 下载预编译 core，那样对 hiddify-core/ 的源码改动
  # 不会生效，所以这里改为自编译并分发给下面的打包 job。
  build-core:
    name: Core / ${{ matrix.target }}
    runs-on: ubuntu-latest
    # 上报失败时不能无限挂起：gomobile/NDK 曾出现过卡死（8 小时不结束），
    # 会把整个 Release 一起拖住。这里给它一个硬上限。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            artifact: hiddify-lib-windows-amd64
          - target: android
            artifact: hiddify-lib-android
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: hiddify-core/go.mod
          check-latest: false
      - if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - if: matrix.target == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - if: matrix.target == 'windows-amd64'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
      - name: Build core
        working-directory: hiddify-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make prepare
          make ${{ matrix.target }}
      - name: Package core
        working-directory: hiddify-core/bin
        run: |
          set -euo pipefail
          files=$(find . \( -name "hiddify-core.dll" \
                -o -name "libcronet.dll" \
                -o -name "hiddify-core.aar" \
                -o -name "TkyaCli.exe" \))
          echo "packing: $files"
          tar -czvf "../${{ matrix.artifact }}.tar.gz" $files
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: hiddify-core/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  build-android:
    needs: [preflight, build-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package from the SDK repository, so the
          # action default "tools platform-tools" now fails with
          # "Failed to find package 'tools'". The runner image already ships the full
          # Android SDK, so platform-tools is enough here.
          packages: 'platform-tools'
      - name: Restore Android release signing key
        if: needs.preflight.outputs.android_signing_ready == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Fetch custom core
        uses: actions/download-artifact@v4
        with:
          name: hiddify-lib-android
          path: core-dist
      - name: Install custom Android core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/libs
          tar -xzf core-dist/hiddify-lib-android.tar.gz -C android/app/libs
          ls -la android/app/libs
      - name: Restore Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          make gen
      - name: Build split Android APKs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --split-per-abi --target lib/main_prod.dart --dart-define=sentry_dsn="$SENTRY_DSN"
      - name: Stage Android assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ANDROID_SIGNING_READY: ${{ needs.preflight.outputs.android_signing_ready }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/Tkya-v${VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/Tkya-v${VERSION}-android-armeabi-v7a.apk"
          if [[ "$ANDROID_SIGNING_READY" != "true" ]]; then
            printf '%s\n' \
              'WARNING: Android APKs use the Gradle debug key because ANDROID_* secrets are not configured.' \
              'Sigstore keyless signatures verify the release artifact and CI identity, but do not replace Android package signing.' \
              'Configure the stable Android keystore secrets before publishing an update over an existing installation.' \
              > out/ANDROID-PLATFORM-SIGNING-WARNING.txt
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: tkya-android
          path: out/
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: [preflight, build-core]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Fetch custom core
        uses: actions/download-artifact@v4
        with:
          name: hiddify-lib-windows-amd64
          path: core-dist
      - name: Install custom Windows core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path hiddify-core/bin | Out-Null
          tar -xzf core-dist/hiddify-lib-windows-amd64.tar.gz -C hiddify-core/bin
          Get-ChildItem hiddify-core/bin
      - name: Restore Flutter packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          make gen
      - name: Build Windows release tree
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build windows --release --target lib/main_prod.dart --dart-define=sentry_dsn="$env:SENTRY_DSN"
      - name: Package Windows portable ZIP and installer
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out'
          $portable = Join-Path $PWD 'portable\Tkya'
          New-Item -ItemType Directory -Force -Path $out, $portable | Out-Null
          Copy-Item 'build\windows\x64\runner\Release\*' $portable -Recurse -Force
          Compress-Archive -Path "$portable\*" -DestinationPath "$out\tkya-$env:VERSION.zip" -Force
          & iscc /Qp tkya_setup.iss
          $installer = Get-ChildItem -Path (Join-Path $PWD 'dist') -Filter "tkya-$env:VERSION.exe" -Recurse -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Inno Setup did not produce tkya-$env:VERSION.exe under dist"
          }
          Copy-Item $installer.FullName "$out\tkya-$env:VERSION.exe" -Force
          Set-Content -Path "$out\WINDOWS-PLATFORM-SIGNING-WARNING.txt" -Value @'
          WARNING: Windows artifacts are not Authenticode-signed in this open-source workflow.
          Sigstore keyless signatures verify the release artifact and GitHub Actions identity, but do not make Windows Smart App Control trust the binary.
          '@
      - uses: actions/upload-artifact@v6
        with:
          name: tkya-windows
          path: out/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [preflight, build-android, build-windows]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: tkya-*
          merge-multiple: true
          path: out/
      - name: Install Cosign for Sigstore keyless signing
        uses: sigstore/cosign-installer@v3
      - name: Generate verification metadata and SHA-256 checksums
        shell: bash
        env:
          EXPECTED_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cd out
          cat > SIGSTORE-VERIFICATION.txt <<EOF
          certificate_identity=$EXPECTED_CERTIFICATE_IDENTITY
          certificate_oidc_issuer=$SIGSTORE_OIDC_ISSUER
          source_repository=${{ github.repository }}
          source_ref=${{ github.ref }}
          source_sha=${{ github.sha }}
          release_tag=${{ needs.preflight.outputs.tag }}
          EOF
          sha256sum Tkya-v*.apk tkya-*.exe tkya-*.zip SIGSTORE-VERIFICATION.txt > SHA256SUMS.txt
      - name: Sign release artifacts with Sigstore keyless
        shell: bash
        env:
          EXPECTED_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cd out
          for file in Tkya-v*.apk tkya-*.exe tkya-*.zip SHA256SUMS.txt SIGSTORE-VERIFICATION.txt; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          for file in Tkya-v*.apk tkya-*.exe tkya-*.zip SHA256SUMS.txt SIGSTORE-VERIFICATION.txt; do
            cosign verify-blob \
              --bundle "${file}.sigstore.json" \
              --certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$SIGSTORE_OIDC_ISSUER" \
              "$file"
          done
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/Tkya-v*.apk
            out/tkya-*.exe
            out/tkya-*.zip
      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Tkya ${{ needs.preflight.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: out/*
