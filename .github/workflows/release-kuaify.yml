name: Kuaify Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v4.1.11
        required: true
        default: v4.1.11
        type: string
      publish:
        description: Publish a GitHub Release with Sigstore keyless signatures
        required: true
        default: false
        type: boolean

# Sigstore keyless signing needs OIDC. The release job only publishes artifacts
# produced by this workflow and signs them with an ephemeral Fulcio certificate.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: kuaify-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      android_signing_ready: ${{ steps.signing.outputs.android_ready }}
      publish: ${{ steps.signing.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version_line="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          version="${version_line%%+*}"
          build_number="${version_line#*+}"
          expected_tag="v${version}"
          if [[ "$REQUESTED_TAG" != "$expected_tag" ]]; then
            echo "Tag $REQUESTED_TAG does not match pubspec version $expected_tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
      - id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          android_ready=false
          publish=false

          # Android's package signature is separate from Sigstore. Keep the
          # stable keystore optional for CI evaluation, but recommend it for
          # install-over-update compatibility with previous Kuaify releases.
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            android_ready=true
          fi
          if [[ ( "$IS_TAG_RELEASE" == "true" || "$MANUAL_PUBLISH" == "true" ) && "$android_ready" == "true" ]]; then
            publish=true
          fi

          echo "android_ready=$android_ready" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$android_ready" != "true" ]]; then
            echo "Public release is gated: configure ANDROID_* secrets so APK updates retain the stable Android package signature."
          fi
          echo "Sigstore keyless signing is enabled; no Azure Trusted Signing secrets are required."

  # core 由独立的 build-core.yml 从**本分支源码**编译，并以「内容寻址的 Release 资产」
  # 缓存（tag: core-cache-<hiddify-core 子树 SHA>）。
  #
  # 这里通过 workflow_call 复用：
  #   * 缓存命中 → 只下载资产（秒级），发布流程不受 core 编译波动影响；
  #   * 缓存缺失 → 在本 run 内编译一次并回写缓存，后续发布即可秒级复用。
  #
  # 🔴 绝不能再改回 `make windows-libs / android-libs`：那两条目标只是下载
  #    hiddify-next-core 的上游预编译包，会让自定义分流规则（SplitRule）
  #    与 Dart 侧编码不匹配，订阅直接 0/N 同步失败。
  #
  # 建议发布前先手动预热（Actions → "Build Core (custom routing rules)" → Run workflow）。
  build-core:
    name: Core
    uses: ./.github/workflows/build-core.yml
    permissions:
      contents: write

  build-android:
    needs: [preflight, build-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Gradle + 自编译 AAR（含 4 个 ABI 的 native 库）+ Flutter 产物会撑爆
      # ubuntu-latest 的剩余空间，实测在 flutter build apk 阶段
      # "No space left on device" 直接中断。先清掉与本构建无关的大件。
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/az /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator || true
          sudo apt-get clean || true
          echo "--- after ---"; df -h /
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy "tools" package from the SDK repository, so the
          # action default "tools platform-tools" now fails with
          # "Failed to find package 'tools'". The runner image already ships the full
          # Android SDK, so platform-tools is enough here.
          packages: 'platform-tools'
      - name: Restore Android release signing key
        if: needs.preflight.outputs.android_signing_ready == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Restore Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          make gen
      - name: Fetch custom core (fork build)
        uses: actions/download-artifact@v4
        with:
          name: hiddify-lib-android
          path: core-dist
      - name: Install custom Android core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/libs
          tar -xzf core-dist/hiddify-lib-android.tar.gz -C android/app/libs
          ls -la android/app/libs
          test -f android/app/libs/hiddify-core.aar
      - name: Build split Android APKs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --split-per-abi --target lib/main_prod.dart --dart-define=sentry_dsn="$SENTRY_DSN"
      - name: Stage Android assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ANDROID_SIGNING_READY: ${{ needs.preflight.outputs.android_signing_ready }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/Kuaify-v${VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/Kuaify-v${VERSION}-android-armeabi-v7a.apk"
          if [[ "$ANDROID_SIGNING_READY" != "true" ]]; then
            printf '%s\n' \
              'WARNING: Android APKs use the Gradle debug key because ANDROID_* secrets are not configured.' \
              'Sigstore keyless signatures verify the release artifact and CI identity, but do not replace Android package signing.' \
              'Configure the stable Android keystore secrets before publishing an update over an existing installation.' \
              > out/ANDROID-PLATFORM-SIGNING-WARNING.txt
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: kuaify-android
          path: out/
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: [preflight, build-core]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Fetch custom core (fork build)
        uses: actions/download-artifact@v4
        with:
          name: hiddify-lib-windows-amd64
          path: core-dist
      - name: Install custom Windows core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path hiddify-core/bin | Out-Null
          tar -xzf core-dist/hiddify-lib-windows-amd64.tar.gz -C hiddify-core/bin
          Get-ChildItem hiddify-core/bin
      - name: Assert custom split-rule core is in place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'hiddify-core/bin/hiddify-core.dll'
          if (-not (Test-Path $dll)) { throw "缺少 $dll" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          foreach ($needle in @('outbound-target', 'rule-set-url')) {
            if (-not $text.Contains($needle)) {
              throw "core guard 失败：$dll 缺少特征串 '$needle'，说明又拿到了上游预编译产物"
            }
          }
          Write-Host 'core guard OK：自定义分流规则核心已就位'
      - name: Restore Flutter packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          make gen
      - name: Build Windows release tree
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build windows --release --target lib/main_prod.dart --dart-define=sentry_dsn="$env:SENTRY_DSN"
      - name: Package Windows portable ZIP and installer
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out'
          $portable = Join-Path $PWD 'portable\Kuaify'
          New-Item -ItemType Directory -Force -Path $out, $portable | Out-Null
          Copy-Item 'build\windows\x64\runner\Release\*' $portable -Recurse -Force
          Compress-Archive -Path "$portable\*" -DestinationPath "$out\kuaify-$env:VERSION.zip" -Force
          & iscc /Qp /DMyAppVersion=$env:VERSION /DMyAppBuild=$env:BUILD_NUMBER kuaify_setup.iss
          $installer = Get-ChildItem -Path (Join-Path $PWD 'dist') -Filter "kuaify-$env:VERSION.exe" -Recurse -File | Select-Object -First 1
          if ($null -eq $installer) {
            Get-ChildItem -Path (Join-Path $PWD 'dist') -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Inno Setup did not produce kuaify-$env:VERSION.exe under dist"
          }
          Copy-Item $installer.FullName "$out\kuaify-$env:VERSION.exe" -Force
          Set-Content -Path "$out\WINDOWS-PLATFORM-SIGNING-WARNING.txt" -Value @'
          WARNING: Windows artifacts are not Authenticode-signed in this open-source workflow.
          Sigstore keyless signatures verify the release artifact and GitHub Actions identity, but do not make Windows Smart App Control trust the binary.
          '@
      - uses: actions/upload-artifact@v6
        with:
          name: kuaify-windows
          path: out/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [preflight, build-android, build-windows]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: kuaify-*
          merge-multiple: true
          path: out/
      - name: Install Cosign for Sigstore keyless signing
        uses: sigstore/cosign-installer@v3
      - name: Generate verification metadata and SHA-256 checksums
        shell: bash
        env:
          EXPECTED_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cd out
          cat > SIGSTORE-VERIFICATION.txt <<EOF
          certificate_identity=$EXPECTED_CERTIFICATE_IDENTITY
          certificate_oidc_issuer=$SIGSTORE_OIDC_ISSUER
          source_repository=${{ github.repository }}
          source_ref=${{ github.ref }}
          source_sha=${{ github.sha }}
          release_tag=${{ needs.preflight.outputs.tag }}
          EOF
          sha256sum Kuaify-v*.apk kuaify-*.exe kuaify-*.zip SIGSTORE-VERIFICATION.txt > SHA256SUMS.txt
      - name: Sign release artifacts with Sigstore keyless
        shell: bash
        env:
          EXPECTED_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cd out
          for file in Kuaify-v*.apk kuaify-*.exe kuaify-*.zip SHA256SUMS.txt SIGSTORE-VERIFICATION.txt; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
          for file in Kuaify-v*.apk kuaify-*.exe kuaify-*.zip SHA256SUMS.txt SIGSTORE-VERIFICATION.txt; do
            cosign verify-blob \
              --bundle "${file}.sigstore.json" \
              --certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$SIGSTORE_OIDC_ISSUER" \
              "$file"
          done
      - name: Attest release build provenance
        # 🔴 本仓库是 private（user-owned），GitHub 的 artifact attestation 只对
        # public 仓库开放：Failed to persist attestation: Feature not available
        # for user-owned private repositories。这里降级为非致命，仓库转 public 后
        # 会自动恢复产出；Sigstore 的 cosign 签名不受影响，仍然照常生成与校验。
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/Kuaify-v*.apk
            out/kuaify-*.exe
            out/kuaify-*.zip
      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Kuaify ${{ needs.preflight.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: out/*
